<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XPlan has moved</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://xplan-sand.vercel.app/" />
    <script>
      // Keep the path, query and hash: /task-manager/demo?x#y -> https://xplan-sand.vercel.app/demo?x#y
      ;(function () {
        var path = location.pathname.replace(/^\/task-manager(?=\/|$)/, '').replace(/\/index\.html$/, '/') || '/'
        location.replace('https://xplan-sand.vercel.app' + path + location.search + location.hash)
      })()
    </script>
    <meta http-equiv="refresh" content="1; url=https://xplan-sand.vercel.app/" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #121519; color: #eceef1; font: 16px/1.5 system-ui, sans-serif; }
      a { color: #ff8a33; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>XPlan has moved</h1>
      <p>The task manager is now <a href="https://xplan-sand.vercel.app/">XPlan at xplan-sand.vercel.app</a>.</p>
    </main>
  </body>
</html>
