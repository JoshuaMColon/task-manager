<!doctype html>
<html lang="en" data-skin="forge">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>XPlan — level up your to-do list</title>
    <meta name="description" content="XPlan turns your tasks into quests: earn XP, keep your combo alive, unlock trophies. A full-stack React + Supabase task manager with natural-language quick add, repeating quests, realtime sync and a command palette." />
    <meta name="theme-color" content="#14171b" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://ghhrqiwrnquyvgpnhhxd.supabase.co" crossorigin />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="XPlan" />
    <meta property="og:title" content="XPlan — level up your to-do list" />
    <meta property="og:description" content="Tasks become quests. Earn XP, keep your combo, unlock trophies." />
    <meta name="twitter:card" content="summary" />
    <script>
      // Apply the saved skin before first paint (no flash).
      try {
        var s = JSON.parse(localStorage.getItem('xplan:skin') || 'null')
        if (s && /^(forge|alloy|bloom|slate)$/.test(s.skin)) document.documentElement.dataset.skin = s.skin
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>XPlan needs JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
